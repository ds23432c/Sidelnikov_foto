[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py init_data || true && python manage.py createsuperuser --noinput || true"
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
