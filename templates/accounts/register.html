{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Регистрация — Folio{% endblock %}

{% block content %}
<div class="container register-page" style="padding-top:60px;max-width:500px">
  <div class="text-center mb-4 register-page__intro">
    <div class="navbar-brand" style="font-size:2rem;margin-bottom:12px">Folio<span style="color:var(--accent)">.</span></div>
    <h2 style="font-size:1.5rem;margin-bottom:4px">Создайте аккаунт</h2>
    <p>Присоединяйтесь к сообществу творческих людей</p>
  </div>
  <div class="card p-4 register-page__card">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-accent w-100 mt-3">Зарегистрироваться</button>
    </form>
  </div>
  <p class="text-center mt-3 register-page__login">
    Уже есть аккаунт? <a href="/accounts/login/">Войти</a>
  </p>
</div>
{% endblock %}
