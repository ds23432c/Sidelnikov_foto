{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Добавить услугу — Folio{% endblock %}

{% block content %}
<div class="container" style="padding-top:60px;max-width:600px">
  <h1 style="font-size:1.8rem;margin-bottom:8px">Добавить услугу</h1>
  <p style="color:var(--muted);margin-bottom:28px">Опишите, что вы предлагаете, и укажите цену</p>
  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn btn-accent">Сохранить</button>
        <a href="/accounts/cabinet/" class="btn btn-ghost">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
