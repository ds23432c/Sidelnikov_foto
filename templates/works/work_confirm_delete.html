{% extends 'base.html' %}
{% block title %}Удалить работу — Folio{% endblock %}

{% block content %}
<div class="container" style="padding-top:80px;max-width:500px;text-align:center">
  <i class="bi bi-trash" style="font-size:3rem;color:#e74c3c;display:block;margin-bottom:16px"></i>
  <h2 style="margin-bottom:8px">Удалить работу?</h2>
  <p style="color:var(--muted);margin-bottom:32px">«{{ work.title }}» будет удалена без возможности восстановления.</p>
  <form method="post" class="d-flex gap-3 justify-content-center">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger-ghost">Да, удалить</button>
    <a href="/work/{{ work.pk }}/" class="btn btn-ghost">Отмена</a>
  </form>
</div>
{% endblock %}
