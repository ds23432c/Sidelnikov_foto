{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} — Folio{% endblock %}

{% block content %}
<div class="container work-form-page" style="padding-top:60px;max-width:700px">
  <h1 style="font-size:1.8rem;margin-bottom:8px">{{ title }}</h1>
  <p style="color:var(--text);margin-bottom:32px">Добавьте изображение файлом или ссылкой</p>
  <div class="card p-4">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn btn-accent">Сохранить</button>
        <a href="{% if work %}/work/{{ work.pk }}/{% else %}/accounts/cabinet/{% endif %}" class="btn btn-ghost">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
